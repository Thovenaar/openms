# Local development only; defaults match ../.env.server.example.
# Override POSTGRES_* in the shell or via --env-file; match server DATABASE_URL.
# User/password/database initialize an empty volume only, not existing data.
name: openms

services:
  postgres:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/openms-postgres:18.6-bookworm
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-openms}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-openms_local_only}"
      POSTGRES_DB: "${POSTGRES_DB:-openms}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    stop_grace_period: 90s
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
    name: openms-postgres-data
